---
.robot:windows:
  tags:
  - robot
  - windows
  script:
  - cd tests\unit\windows\Release
  - .\pkcs11_tests.exe zetes:COM4:COM3 nopin

.build-windows:
  variables:
    GIT_DEPTH: 0
  image: $WINDOWS_BUILD_IMAGE
  dependencies: []
  before_script:
  - del $Env:WINDOWS_BASEDIR\scripts\windows\*.exe
  - '$pfxFilename = (Get-Location | Select-Object -expandProperty path) + "\certificate.pfx"'
  - '[System.IO.File]::WriteAllBytes($pfxFilename, [Convert]::FromBase64String((Get-Content $Env:WINDOWS_SIGNING_CERT_B64 -Raw)))'
  - '$secureString = convertto-securestring $Env:WINDOWS_SIGNING_CERT_PWD -asplaintext -force'
  - 'Import-PfxCertificate -Password $secureString -FilePath $pfxFilename -CertStoreLocation "cert:\CurrentUser\My"'
  script:
  - cd $Env:WINDOWS_BASEDIR\scripts\windows
  - ./build_minidriver.bat
  - ./build_all.bat
  - ./build_testsuite.bat
  after_script:
  - mkdir products\windows
  - xcopy $Env:WINDOWS_BASEDIR\scripts\windows\*.exe products\windows
  - xcopy $Env:WINDOWS_BASEDIR\scripts\windows\*.msi products\windows
  tags:
  - windows
  - windows-docker
  artifacts:
    when: on_success
    paths:
    - products\windows
    - cardcomm\minidriver\*\Binaries\*\*.lib
    - cardcomm\pkcs11\*\Binaries\*\*.lib
    - installers\quickinstaller\NSIS_Plugins\beidread\*\*\*.lib
    - plugins_tools\eid-viewer\Windows\*\eIDViewer\bin\*\*.lib
    - tests\unit

